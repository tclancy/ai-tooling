name: tests
on:
  push:
    branches: [main]   # PRs covered by pull_request; avoids double-runs
  pull_request:
  workflow_dispatch:   # lets maintainers re-run CI manually

jobs:
  bash:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # /bin/bash on the macOS runner is 3.2 — the compatibility target.
      - run: /bin/bash tests/installer/run_sh_tests.sh

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SHA-pinned to the same v9.0.0 the rest of the fleet uses (awairelement ci.yml).
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Asserts SKILL.md's ~40 quoted figures are still calibrate.sh's output.
      - run: /bin/bash tests/skills/run_sh_tests.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, NOT pwsh — the stated target
    steps:
      - uses: actions/checkout@v4
      - run: .\tests\installer\run_ps1_tests.ps1
